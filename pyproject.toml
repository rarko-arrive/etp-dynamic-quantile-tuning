[project]
name = "etp-dqt"
version = "0.1.0"
description = "Dynamic Quantile Tuning — Snowflake features, hybrid quantiles, walk-forward SARIMA dial"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "arriveds[azure]",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.0.0",
    "loguru>=0.7.0",
    "nbformat>=5.11.1",
    "plotly>=7.0.0",
    "polars>=1.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqt", "scripts"]

[tool.uv.sources]
arriveds = { git = "ssh://git@github.com/rarko-arrive/arrive-ds.git", rev = "v0.3.2" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "sqlfluff>=4.3.0",
]

[tool.ruff.lint]
ignore = ["C408", "RUF046"]
