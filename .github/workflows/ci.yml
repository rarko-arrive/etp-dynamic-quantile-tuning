name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # secrets.* cannot appear in `if:` (workflow parse error). Key must be set
      # in repo Settings → Secrets for uv to fetch arriveds from arrive-ds.
      - name: Load SSH key for private dependencies
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ARRIVE_DS_DEPLOY_KEY }}

      - name: Trust github.com host key
        run: ssh-keyscan -t ed25519 github.com >> "${SSH_DIR:-$HOME/.ssh}/known_hosts"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint Python
        run: uv run ruff check src/ scripts/

      - name: Test
        run: make test

      - name: Pipeline smoke (no Snowflake)
        run: make smoke-pipeline
