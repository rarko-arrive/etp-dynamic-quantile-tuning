name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Public CI cannot read private arrive-ds over SSH without a deploy key.
      # Patch pyproject to use the in-repo stub (see ci/arriveds-stub/).
      - name: Use arriveds CI stub
        run: python3 ci/patch_arriveds_source.py

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint Python
        run: uv run ruff check src/ scripts/

      - name: Test
        run: make test

      - name: Pipeline smoke (no Snowflake)
        run: make smoke-pipeline
